name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键：安装系统依赖，让字体库能工作（但后续我们还会 mock，双重保险）
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libffi-dev libfontconfig1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # 核心：mock cn-font-split 使其不报错
      - name: Mock cn-font-split
        run: |
          rm -rf node_modules/cn-font-split
          mkdir -p node_modules/cn-font-split
          echo "module.exports = {};" > node_modules/cn-font-split/index.js

      - name: Build site
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4